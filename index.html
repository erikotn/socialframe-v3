                    </div>

                    {/* Simple-mode defaults */}
                    {mode === 'simple' && (
                        <div className="space-y-2 bg-dark-900 rounded-lg p-3 border border-white/5">
                            <div>
                                <label className="block text-[10px] text-gray-400 mb-1">Brand</label>
                                <select value={defaults.brand?.id || ''}
                                    onChange={e => {
                                        const b = brandKits.find(k => String(k.id) === e.target.value) || null;
                                        setDefaults(d => ({ ...d, brand: b }));
                                    }}
                                    className="w-full bg-dark-800 border border-gray-700 rounded px-2 py-2 text-sm">
                                    <option value="">— kies brand —</option>
                                    {brandKits.map(k => <option key={k.id} value={k.id}>{k.name || k.senderName}</option>)}
                                </select>
                                {defaults.brand && (
                                    <div className="flex items-center gap-2 mt-2 text-[10px] text-gray-400 bg-dark-800 rounded px-2 py-1.5 border border-white/5">
                                        <div className="w-6 h-6 rounded-full bg-dark-700 overflow-hidden flex-shrink-0">
                                            {defaults.brand.avatar?.src ? <img src={defaults.brand.avatar.src} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-gray-600 text-[8px]">?</div>}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="truncate text-gray-300">{defaults.brand.senderName || defaults.brand.name}</div>
                                            <div className="truncate text-[9px] text-gray-500">{defaults.brand.url || '(geen url)'}</div>
                                        </div>
                                        {!defaults.brand.avatar?.src && (
                                            <span className="text-yellow-400 text-[9px] flex-shrink-0" title="Brand-kit heeft geen avatar opgeslagen — open de Brands-tab om er een te uploaden">⚠ geen avatar</span>
                                        )}
                                    </div>
                                )}
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="block text-[10px] text-gray-400 mb-1">Platform</label>
                                    <select value={defaults.platformId} onChange={e => setDefaults(d => ({ ...d, platformId: e.target.value }))}
                                        className="w-full bg-dark-800 border border-gray-700 rounded px-2 py-2 text-sm">
                                        {Object.entries(PLATFORMS).map(([id, p]) => <option key={id} value={id}>{p.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] text-gray-400 mb-1">Format</label>
                                    <select value={defaults.formatId} onChange={e => setDefaults(d => ({ ...d, formatId: e.target.value }))}
                                        className="w-full bg-dark-800 border border-gray-700 rounded px-2 py-2 text-sm">
                                        {Object.entries(FORMATS).map(([id, f]) => <option key={id} value={id}>{f.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] text-gray-400 mb-1">Frame</label>
                                    <select value={defaults.frame} onChange={e => setDefaults(d => ({ ...d, frame: e.target.value }))}
                                        className="w-full bg-dark-800 border border-gray-700 rounded px-2 py-2 text-sm">
                                        <option value="shadow">Shadow</option>
                                        <option value="outline">Outline</option>
                                        <option value="none">None</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] text-gray-400 mb-1">Gedeelde foto</label>
                                    <div className="relative">
                                        <label className="w-full block bg-dark-800 border border-dashed border-gray-700 rounded px-2 py-2 pr-7 text-xs text-gray-400 cursor-pointer hover:border-blue-500 truncate">
                                            {sharedImage ? `✓ ${sharedImage.width}×${sharedImage.height}` : 'klik om te uploaden'}
                                            <input type="file" accept="image/*" onChange={onSharedImageUpload} />
                                        </label>
                                        {sharedImage && (
                                            <button type="button"
                                                onClick={() => setSharedImage(null)}
                                                title="Gedeelde foto wissen"
                                                className="absolute top-1.5 right-1.5 bg-black/70 hover:bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs leading-none">
                                                ×
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Multi-image drop zone */}
                    <div
                        className="p-3 bg-dark-900 border border-dashed border-gray-700 rounded-lg text-xs text-gray-400 hover:border-blue-500 transition-colors"
                        onDragOver={e => e.preventDefault()}
                        onDrop={onDropImages}
                    >
                        <div className="font-bold text-gray-300">Foto-pool</div>
                        <p className="mt-1">Sleep meerdere foto's hierheen. TSV-rijen verwijzen ernaar via <code className="text-blue-400">image_filename</code>.</p>
                        {Object.keys(bulkImages).length > 0 && (
                            <div className="mt-2 flex flex-wrap gap-1">
                                {Object.keys(bulkImages).map(name => (
                                    <span key={name} className="text-[10px] bg-dark-700 px-2 py-0.5 rounded text-gray-300">{name}</span>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Claude prompt button */}
                    <div>
                        <button onClick={copyClaudePrompt}
                            className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-lg text-sm">
                            📋 Kopieer Claude-prompt
                        </button>
                        {hint && <p className="text-[11px] text-green-400 mt-1">{hint}</p>}
                    </div>

                    {/* TSV textarea */}
                    <div>
                        <label className="block text-[11px] text-gray-400 mb-1">Plak TSV (uit Claude of Sheets)</label>
                        <textarea rows="8" value={tsvText} onChange={e => setTsvText(e.target.value)}
                            placeholder={(mode === 'simple' ? BULK_HEADERS_SIMPLE : BULK_HEADERS_ADVANCED).join('\t') + '\nrij1\trij1\t...\nrij2\trij2\t...'}
                            className="w-full bg-dark-900 border border-gray-700 rounded px-2 py-2 text-[11px] font-mono resize-none" />
                    </div>

                    {/* Validatie / preview */}
                    {parsed.headerError && (
                        <div className="bg-red-900/40 border border-red-700 rounded p-2 text-xs text-red-300">{parsed.headerError}</div>
                    )}
                    {parsed.rows.length > 0 && (
                        <div className="bg-dark-900 rounded-lg border border-white/5 overflow-hidden">
                            <div className="px-3 py-2 border-b border-white/5 text-[11px] text-gray-400 flex justify-between">
                                <span>{parsed.rows.length} rijen · {validCount} klaar · {skipCount} skipped</span>
                            </div>
                            <div className="max-h-48 overflow-y-auto">
                                {parsed.rows.map(r => {
                                    const hasErr = r.errors.length > 0;
                                    const hasWarn = r.warnings.length > 0;
                                    return (
                                        <div key={r.rowNum} className={`px-3 py-1.5 text-[11px] border-b border-white/5 flex items-center gap-2 ${r.skip ? 'opacity-40' : ''} ${hasErr ? 'bg-red-900/20' : hasWarn ? 'bg-yellow-900/20' : ''}`}>
                                            <input type="checkbox" checked={!r.skip && !hasErr} disabled={hasErr}
                                                onChange={() => toggleSkip(r.rowNum)} className="flex-shrink-0" />
                                            <span className="text-gray-500 w-6 flex-shrink-0">{r.rowNum}</span>
                                            <span className="flex-1 truncate text-gray-300">{r.fields.headline || r.fields.naam || r.fields.posttekst?.slice(0, 40) || '(leeg)'}</span>
                                            {hasErr && <span className="text-red-400 text-[10px]" title={r.errors.join('; ')}>⚠ {r.errors[0]}</span>}
                                            {!hasErr && hasWarn && <span className="text-yellow-400 text-[10px]" title={r.warnings.join('; ')}>⚠</span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* Campagne-naam — verplicht voor cloud-gallery-grouping */}
                    <div>
                        <label className="block text-[11px] text-gray-400 mb-1">Campagne-naam (verplicht)</label>
                        <input type="text" value={campaignLabel}
                            placeholder="Vul campagne-naam in"
                            onChange={e => setCampaignLabel(e.target.value)}
                            className="w-full bg-dark-900 border border-gray-700 rounded px-2 py-2 text-sm" />
                        <p className="text-[10px] text-gray-500 mt-1">Verschijnt als naam in de Gallery én in bestandsnamen.</p>
                    </div>

                    {/* Generate ZIP */}
                    <button onClick={generateBulk} disabled={!validCount || progress || !campaignLabel.trim()}
                        className="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-sm">
                        {progress ? `Bezig (${progress.done}/${progress.total})` : `Genereer ZIP + Gallery (${validCount} mockups)`}
                    </button>

        // ============== PASSWORD GATE ==============
        function PasswordGate({ onAuthed }) {
            const [pw, setPw] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault();
                if (!pw) return;
                setLoading(true);
                setError('');
                localStorage.setItem(PW_STORAGE_KEY, pw);
                try {
                    await apiCall(DESIGNS_STORE, 'list');
                    onAuthed();
                } catch (err) {
                    localStorage.removeItem(PW_STORAGE_KEY);
                    if (err.message === 'WRONG_PASSWORD') setError('Onjuist wachtwoord.');
                    else setError('Kan geen verbinding maken: ' + err.message);
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-dark-900 flex items-center justify-center z-50 p-4">
                    <form onSubmit={submit} className="bg-dark-800 p-8 rounded-2xl border border-white/10 w-full max-w-sm space-y-4 shadow-2xl">
                        <div>
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">SocialFrame v3</h1>
                            <p className="text-sm text-gray-400 mt-1">Voer het team-wachtwoord in om bij de cloud-bibliotheek te komen.</p>
                        </div>
                        <input
                            type="password"
                            value={pw}
                            onChange={e => setPw(e.target.value)}
                            className="w-full bg-dark-900 border border-gray-700 rounded px-3 py-2.5 text-sm focus:border-blue-500 outline-none"
                            placeholder="Wachtwoord"
                            autoFocus
                        />
                        {error && <p className="text-xs text-red-400">{error}</p>}
                        <button type="submit" disabled={loading || !pw}
                            className="w-full bg-white text-black font-bold py-2.5 rounded-lg hover:bg-gray-200 disabled:opacity-50">
                            {loading ? 'Verifiëren…' : 'Inloggen'}
                        </button>
                    </form>
                </div>
            );
        }

        // ============== SHARE MODE (v3.1) ==============
        // Public-action variant van apiCall (geen password header) — gebruikt
        // door zowel ShareView als ShareRunView.
        const sharePublicCall = async (action, payload) => {
            const res = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'apikey': SUPABASE_ANON_KEY,
                },
                body: JSON.stringify({ action, payload }),
            });
            if (res.status === 410) throw new Error('Deze share-link is verlopen.');
            if (res.status === 404) throw new Error('Deze share-link bestaat niet (meer).');
            if (!res.ok) {
                const txt = await res.text().catch(() => '');
                throw new Error(`Server-fout: ${res.status} ${txt}`);
            }
            return await res.json();
        };

        // Stripped-down view voor URLs met ?share=TOKEN. Geen login, geen sidebar.
        // De ontvanger ziet één mockup en kan een foto uploaden.
        function ShareView({ token }) {
            const [design, setDesign] = useState(null);
            const [error, setError] = useState('');
            const [uploading, setUploading] = useState(false);
            const [uploaded, setUploaded] = useState(false);

            // Body heeft default overflow-hidden voor de main app — in share-mode
            // willen we wel kunnen scrollen.
            useEffect(() => {
                document.body.classList.remove('overflow-hidden', 'h-screen');
                document.body.classList.add('min-h-screen');
                return () => {
                    document.body.classList.add('overflow-hidden', 'h-screen');
                    document.body.classList.remove('min-h-screen');
                };
            }, []);

            useEffect(() => {
                let cancelled = false;
                (async () => {
                    try {
                        const d = await sharePublicCall('share-get-design', { share_token: token });
                        if (cancelled) return;
                        setDesign(d);
                    } catch (e) {
                        if (!cancelled) setError(e.message);
                    }
                })();
                return () => { cancelled = true; };
            }, [token]);

            const handleUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setUploading(true);
                setError('');
                try {
                    const imageData = await fileToImageData(file);
                    await sharePublicCall('share-set-image', { share_token: token, imageData });
                    // Re-fetch design to show the new image
                    const d = await sharePublicCall('share-get-design', { share_token: token });
                    setDesign(d);
                    setUploaded(true);
                } catch (err) {
                    setError(err.message);
                }
                setUploading(false);
                e.target.value = '';
            };

            if (error) {
                return (
                    <div className="h-screen flex items-center justify-center bg-dark-900 p-4">
                        <div className="bg-dark-800 border border-red-700/50 rounded-2xl p-8 max-w-sm text-center">
                            <h1 className="text-xl font-bold text-red-300 mb-2">Oeps</h1>
                            <p className="text-sm text-gray-400">{error}</p>
                        </div>
                    </div>
                );
            }

            if (!design) {
                return <div className="h-screen flex items-center justify-center text-gray-400 text-sm bg-dark-900">Mockup laden…</div>;
            }

            // Build content for CanvasPreview
            return (
                <div className="min-h-screen bg-dark-900 flex flex-col items-center justify-center p-6">
                    <div className="max-w-md w-full text-center mb-6">
                        <h1 className="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">SocialFrame · gedeelde mockup</h1>
                        {design.bulk_run_label && (
                            <p className="text-xs text-gray-500 mt-1">Campagne: {design.bulk_run_label}</p>
                        )}
                        <p className="text-sm text-gray-400 mt-3">
                            {design.awaiting_photo
                                ? 'Upload een foto om deze mockup compleet te maken.'
                                : uploaded
                                    ? '✓ Foto toegevoegd. Bedankt!'
                                    : "Foto al ingevuld. Je kunt 'm vervangen door een andere te uploaden."}
                        </p>
                    </div>

                    <div className="max-w-md w-full bg-dark-800 rounded-2xl p-4 border border-white/5 mb-6">
                        <CanvasPreview
                            platformId={design.platform_id}
                            formatId={design.format_id}
                            content={design.content}
                            style={design.style}
                        />
                    </div>

                    <div className="flex flex-wrap gap-2 justify-center">
                        <label className="bg-white text-black font-bold py-3 px-6 rounded-lg hover:bg-gray-200 cursor-pointer text-sm">
                            {uploading ? 'Bezig met uploaden…' : (design.content?.mainImage ? 'Vervang foto' : 'Upload foto')}
                            <input type="file" accept="image/*" onChange={handleUpload} disabled={uploading} className="hidden" />
                        </label>
                        {design.content?.mainImage && (
                            <>
                                <button onClick={async () => {
                                    try {
                                        const canvas = await renderToCanvas({
                                            platformId: design.platform_id,
                                            formatId: design.format_id,
                                            content: design.content,
                                            style: design.style,
                                        });
                                        canvas.toBlob((blob) => {
                                            const safeName = (design.content?.name || 'mockup').replace(/[^a-z0-9_-]/gi, '_');
                                            saveAs(blob, `${safeName}.png`);
                                        }, 'image/png');
                                    } catch (e) { alert('Download mislukt: ' + e.message); }
                                }}
                                    className="bg-dark-700 hover:bg-dark-800 text-white border border-white/10 font-bold py-3 px-6 rounded-lg text-sm">
                                    ⬇ Download PNG
                                </button>
                                <button onClick={async () => {
                                    if (!confirm('Foto verwijderen? De mockup gaat terug naar de placeholder.')) return;
                                    setUploading(true);
                                    setError('');
                                    try {
                                        await sharePublicCall('share-set-image', { share_token: token, imageData: null });
                                        const d = await sharePublicCall('share-get-design', { share_token: token });
                                        setDesign(d);
                                        setUploaded(false);
                                    } catch (err) { setError(err.message); }
                                    setUploading(false);
                                }}
                                    disabled={uploading}
                                    className="bg-red-600/70 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg text-sm disabled:opacity-50">
                                    🗑 Verwijder foto
                                </button>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // ============== SHARE RUN VIEW (v3.1.1) ==============
        // Toont alle mockups in een bulk-run als gallery; elke mockup heeft
        // zijn eigen upload-knop. Een collega vult zo in één sessie alle
        // ontbrekende foto's voor de campagne in.
        function ShareRunView({ token }) {
            const [runData, setRunData] = useState(null); // { bulk_run_label, designs: [...] }
            const [error, setError] = useState('');
            const [uploadingId, setUploadingId] = useState(null);

            // Body heeft default overflow-hidden voor de main app — in share-mode
            // willen we wel kunnen scrollen door alle mockups.
            useEffect(() => {
                document.body.classList.remove('overflow-hidden', 'h-screen');
                document.body.classList.add('min-h-screen');
                return () => {
                    document.body.classList.add('overflow-hidden', 'h-screen');
                    document.body.classList.remove('min-h-screen');
                };
            }, []);

            const fetchRun = async () => {
                try {
                    const data = await sharePublicCall('share-get-run', { share_token: token });
                    setRunData(data);
                } catch (e) {
                    setError(e.message);
                }
            };

            useEffect(() => { fetchRun(); }, [token]);

            const handleUpload = async (designId, e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setUploadingId(designId);
                setError('');
                try {
                    const imageData = await fileToImageData(file);
                    await sharePublicCall('share-set-image-by-run', {
                        share_token: token, design_id: designId, imageData,
                    });
                    await fetchRun();
                } catch (err) {
                    setError(err.message);
                }
                setUploadingId(null);
                e.target.value = '';
            };

            if (error) {
                return (
                    <div className="h-screen flex items-center justify-center bg-dark-900 p-4">
                        <div className="bg-dark-800 border border-red-700/50 rounded-2xl p-8 max-w-sm text-center">
                            <h1 className="text-xl font-bold text-red-300 mb-2">Oeps</h1>
                            <p className="text-sm text-gray-400">{error}</p>
                        </div>
                    </div>
                );
            }

            if (!runData) {
                return <div className="h-screen flex items-center justify-center text-gray-400 text-sm bg-dark-900">Mockups laden…</div>;
            }

            const awaiting = runData.designs.filter(d => d.awaiting_photo).length;

            return (
                <div className="min-h-screen bg-dark-900 py-8 px-4">
                    <div className="max-w-2xl mx-auto text-center mb-8">
                        <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">SocialFrame · gedeelde campagne</h1>
                        {runData.bulk_run_label && (
                            <p className="text-sm text-gray-300 mt-2">{runData.bulk_run_label}</p>
                        )}
                        <p className="text-sm text-gray-400 mt-3">
                            {runData.designs.length} mockup{runData.designs.length === 1 ? '' : 's'}
                            {awaiting > 0 && <span className="text-yellow-400"> · {awaiting} wacht{awaiting === 1 ? '' : 'en'} op foto</span>}
                        </p>
                        <p className="text-xs text-gray-500 mt-2">Upload een foto per mockup. Andere velden zijn niet aan te passen.</p>
                    </div>

                    <div className="max-w-2xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4">
                        {runData.designs.map(d => {
                            const isUploading = uploadingId === d.id;
                            return (
                                <div key={d.id} className="bg-dark-800 rounded-xl p-3 border border-white/5">
                                    <div className="mb-3">
                                        <CanvasPreview
                                            platformId={d.platform_id}
                                            formatId={d.format_id}
                                            content={d.content}
                                            style={d.style}
                                        />
                                    </div>
                                    <div className="text-[10px] mb-2">
                                        {d.awaiting_photo ? (
                                            <span className="text-yellow-400">📷 wacht op foto</span>
                                        ) : (
                                            <span className="text-green-400">✓ foto geplaatst</span>
                                        )}
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        <label className="bg-white text-black font-bold py-1.5 px-3 rounded text-[11px] hover:bg-gray-200 cursor-pointer whitespace-nowrap">
                                            {isUploading ? '…' : (d.content?.mainImage ? 'Vervang' : 'Upload')}
                                            <input type="file" accept="image/*"
                                                onChange={(e) => handleUpload(d.id, e)}
                                                disabled={isUploading}
                                                className="hidden" />
                                        </label>
                                        {d.content?.mainImage && (
                                            <>
                                                <button onClick={async () => {
                                                    try {
                                                        const canvas = await renderToCanvas({
                                                            platformId: d.platform_id,
                                                            formatId: d.format_id,
                                                            content: d.content,
                                                            style: d.style,
                                                        });
                                                        canvas.toBlob((blob) => {
                                                            const safeName = (d.content?.name || 'mockup').replace(/[^a-z0-9_-]/gi, '_');
                                                            saveAs(blob, `${safeName}.png`);
                                                        }, 'image/png');
                                                    } catch (e) { alert('Download mislukt: ' + e.message); }
                                                }}
                                                    className="bg-dark-700 hover:bg-dark-900 text-white border border-white/10 font-bold py-1.5 px-3 rounded text-[11px] whitespace-nowrap">⬇ PNG</button>
                                                <button onClick={async () => {
                                                    if (!confirm('Foto verwijderen?')) return;
                                                    setUploadingId(d.id);
                                                    try {
                                                        await sharePublicCall('share-set-image-by-run', {
                                                            share_token: token, design_id: d.id, imageData: null,
                                                        });
                                                        await fetchRun();
                                                    } catch (err) { setError(err.message); }
                                                    setUploadingId(null);
                                                }}
                                                    disabled={isUploading}
                                                    className="bg-red-600/70 hover:bg-red-600 text-white font-bold py-1.5 px-3 rounded text-[11px] whitespace-nowrap disabled:opacity-50">🗑</button>
                                            </>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ============== APP ==============
        function App() {
            // Check ?share=TOKEN op eerste render — als die er is, ga naar share-mode
            // (geen password-gate, geen sidebar). URL params worden eenmalig gelezen.
            const urlParams = useMemo(() => {
                if (typeof window === 'undefined') return { share: null, run: null };
                const url = new URL(window.location.href);
                return {
                    share: url.searchParams.get('share'),
                    run: url.searchParams.get('run'),
                };
            }, []);

            const [authed, setAuthed] = useState(false);
            const [authChecking, setAuthChecking] = useState(true);

            useEffect(() => {
                if (urlParams.share || urlParams.run) { setAuthChecking(false); return; }
                const pw = localStorage.getItem(PW_STORAGE_KEY);
                if (!pw) { setAuthChecking(false); return; }
                apiCall(DESIGNS_STORE, 'list')
                    .then(() => { setAuthed(true); setAuthChecking(false); })
                    .catch(() => { setAuthChecking(false); });
            }, [urlParams.share, urlParams.run]);

            if (urlParams.run) return <ShareRunView token={urlParams.run} />;
            if (urlParams.share) return <ShareView token={urlParams.share} />;

            if (authChecking) {
                return <div className="h-screen flex items-center justify-center text-gray-400 text-sm">Verbinding maken…</div>;
            }
            if (!authed) return <PasswordGate onAuthed={() => setAuthed(true)} />;

            return <Workspace onLogout={() => { localStorage.removeItem(PW_STORAGE_KEY); setAuthed(false); }} />;
        }

        function Workspace({ onLogout }) {
            const [platformId, setPlatformId] = useState('linkedin');
            const [formatId, setFormatId] = useState('feed-4-5');
            const [sidebarTab, setSidebarTab] = useState('edit');
            const [loading, setLoading] = useState(false);
            const [batchProgress, setBatchProgress] = useState(null);
            const [savedDesigns, setSavedDesigns] = useState([]);
            const [brandKits, setBrandKits] = useState([]);
            const [dropping, setDropping] = useState(false);

            // Bulk-tab state (v3)
            const [bulkMode, setBulkMode] = useState('simple');
            const [bulkDefaults, setBulkDefaults] = useState({
                brand: null,
                platformId: 'linkedin',
                formatId: 'feed-4-5',
                frame: 'shadow',
            });

            // Gallery state (v3.1)
            const [expandedRuns, setExpandedRuns] = useState(new Set());
            const [shareModalDesign, setShareModalDesign] = useState(null);
            const [shareModalRun, setShareModalRun] = useState(null); // {runId, runLabel}
            const [galleryRefreshing, setGalleryRefreshing] = useState(false);
            const [moveModalState, setMoveModalState] = useState(null); // {ids: [...], onDone}

            // Save-to-collection (v3.1.2) — Edit-tab Save knop
            // saveTargetMode: '' (losse mockup) | '__new__' (nieuwe collectie) | runId (bestaand)
            const [saveTargetMode, setSaveTargetMode] = useState('');
            const [newCollectionName, setNewCollectionName] = useState('');

            const [content, setContent] = useState({
                avatar: null,
                mainImage: null,
                name: 'Bedrijfsnaam B.V.',
                text: 'Ontdek onze nieuwste collectie! We hebben hard gewerkt aan unieke designs.',
                headline: 'Nieuwe Collectie',
                buttonText: 'Lees meer',
                url: 'bedrijfsnaam.nl',
                verified: false,
                likes: 124,
                comments: 12,
                shares: 4,
                imageDescription: '',  // briefing-tekst voor de vormgever wanneer er nog geen foto is
                imageText: '',          // tekst die op het beeld moet komen
            });

            const [style, setStyle] = useState({
                bgColor1: '#ffffff',
                bgColor2: '#f4f4f5',
                bgType: 'solid',
                padding: 40,
                darkMode: false,
                deviceFrame: 'shadow', // 'none' | 'shadow' | 'outline'
                phoneWidth: 320,
                phoneHeight: 650,
            });

            const [exportOpts, setExportOpts] = useState({
                formats: { 'feed-4-5': true, 'feed-1-1': false, 'feed-1-91': false, 'story-9-16': false },
                platforms: { linkedin: true, meta: false, instagram: false, tiktok: false },
                modes: { light: true, dark: false }
            });

            // Load saved data from Supabase
            useEffect(() => {
                (async () => {
                    try {
                        const [d, b] = await Promise.all([
                            apiCall(DESIGNS_STORE, 'list'),
                            apiCall('brand_kits', 'list'),
                        ]);
                        setSavedDesigns(d.map(fromDbDesign));
                        setBrandKits(b.map(fromDbKit));
                    } catch (e) {
                        console.error('Load failed:', e);
                    }
                })();
            }, []);

            // Paste handler
            useEffect(() => {
                const handlePaste = async (e) => {
                    if (!e.clipboardData) return;
                    for (const item of e.clipboardData.items) {
                        if (item.type.startsWith('image/')) {
                            const file = item.getAsFile();
                            if (file) {
                                const data = await fileToImageData(file);
                                setContent(prev => ({ ...prev, mainImage: data }));
                                return;
                            }
                        }
                    }
                };
                document.addEventListener('paste', handlePaste);
                return () => document.removeEventListener('paste', handlePaste);
            }, []);

            const platform = PLATFORMS[platformId];
            const format = FORMATS[formatId];

            const updateContent = (k, v) => setContent(prev => ({ ...prev, [k]: v }));
            const updateStyle = (k, v) => setStyle(prev => ({ ...prev, [k]: v }));

            const handleImageUpload = async (key, e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const data = await fileToImageData(file);
                setContent(prev => ({ ...prev, [key]: data }));
                e.target.value = ''; // allow re-upload of same file
            };

            const handleDrop = async (e) => {
                e.preventDefault();
                setDropping(false);
                const file = e.dataTransfer.files?.[0];
                if (!file?.type.startsWith('image/')) return;
                const data = await fileToImageData(file);
                setContent(prev => ({ ...prev, mainImage: data }));
            };

            const applyPlatform = (id) => {
                setPlatformId(id);
                const p = PLATFORMS[id];
                setContent(prev => ({ ...prev, buttonText: p.buttonText }));
                if (p.layout === 'story' && !FORMATS[formatId].isStory) setFormatId('story-9-16');
                if (p.layout !== 'story' && FORMATS[formatId].isStory) setFormatId('feed-4-5');
            };

            const applyFormat = (id) => {
                setFormatId(id);
                if (FORMATS[id].isStory && PLATFORMS[platformId].layout !== 'story') setPlatformId('tiktok');
                if (!FORMATS[id].isStory && PLATFORMS[platformId].layout === 'story') setPlatformId('instagram');
            };

            // Brand kits (cloud)
            const saveBrandKit = async () => {
                const kitName = prompt('Naam voor deze brand kit (bv. Cosis):');
                if (!kitName) return;
                const kit = {
                    id: Date.now(),
                    name: kitName,
                    avatar: content.avatar,
                    senderName: content.name,
                    url: content.url,
                    verified: content.verified,
                };
                try {
                    await apiCall('brand_kits', 'save', toDbKit(kit));
                    const list = await apiCall('brand_kits', 'list');
                    setBrandKits(list.map(fromDbKit));
                } catch (e) { alert('Opslaan mislukt: ' + e.message); }
            };

            const loadBrandKit = (kit) => {
                setContent(prev => ({
                    ...prev,
                    avatar: kit.avatar,
                    name: kit.senderName,
                    url: kit.url,
                    verified: kit.verified ?? false
                }));
            };

            const deleteBrandKit = async (id, e) => {
                e.stopPropagation();
                try {
                    await apiCall('brand_kits', 'delete', { id: String(id) });
                    const list = await apiCall('brand_kits', 'list');
                    setBrandKits(list.map(fromDbKit));
                } catch (err) { alert('Verwijderen mislukt: ' + err.message); }
            };

            // Designs library (cloud)
            const saveDesign = async () => {
                // Resolve waar de mockup naartoe moet:
                //   '' = losse mockup (geen bulk_run_id)
                //   '__new__' = nieuwe collectie met newCollectionName als label
                //   <runId> = toevoegen aan bestaande collectie
                let bulkRunId = null;
                let bulkRunLabel = null;
                if (saveTargetMode === '__new__') {
                    if (!newCollectionName.trim()) {
                        alert('Vul een naam in voor de nieuwe collectie.');
                        return;
                    }
                    bulkRunId = (typeof crypto !== 'undefined' && crypto.randomUUID)
                        ? crypto.randomUUID()
                        : `run-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
                    bulkRunLabel = newCollectionName.trim();
                } else if (saveTargetMode) {
                    // Bestaande collectie — haal label op uit savedDesigns
                    const existing = savedDesigns.find(d => d.bulkRunId === saveTargetMode);
                    if (!existing) {
                        alert('Kon bestaande collectie niet vinden — kies opnieuw.');
                        return;
                    }
                    bulkRunId = saveTargetMode;
                    bulkRunLabel = existing.bulkRunLabel;
                }

                const hasBriefing = (content.imageDescription && content.imageDescription.trim())
                    || (content.imageText && content.imageText.trim());
                const awaitingPhoto = !content.mainImage && !!hasBriefing;
                const newDesign = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    platformId, formatId, content, style,
                    awaitingPhoto, bulkRunId, bulkRunLabel,
                };
                try {
                    await apiCall(DESIGNS_STORE, 'save', toDbDesign(newDesign));
                    const list = await apiCall(DESIGNS_STORE, 'list');
                    setSavedDesigns(list.map(fromDbDesign));
                    // Reset only de "nieuwe collectie"-naam; behoud target-mode
                    if (saveTargetMode === '__new__') setNewCollectionName('');
                    setSidebarTab('library');
                } catch (e) { alert('Opslaan mislukt: ' + e.message); }
            };

            const loadDesign = (d) => {
                if (d.platformId) setPlatformId(d.platformId);
                if (d.formatId) setFormatId(d.formatId);
                setContent(d.content);
                setStyle(d.style);
                setSidebarTab('edit');
            };

            const deleteDesign = async (id, e) => {
                if (e) e.stopPropagation();
                try {
                    await apiCall(DESIGNS_STORE, 'delete', { id: String(id) });
                    const list = await apiCall(DESIGNS_STORE, 'list');
                    setSavedDesigns(list.map(fromDbDesign));
                } catch (err) { alert('Verwijderen mislukt: ' + err.message); }
            };

            // Gallery helpers (v3.1)
            const refreshGallery = async () => {
                setGalleryRefreshing(true);
                try {
                    const list = await apiCall(DESIGNS_STORE, 'list');
                    setSavedDesigns(list.map(fromDbDesign));
                } catch (e) { console.error('refresh failed', e); }
                setGalleryRefreshing(false);
            };

            const toggleRunExpand = (runId) => {
                setExpandedRuns(prev => {
                    const next = new Set(prev);
                    if (next.has(runId)) next.delete(runId);
                    else next.add(runId);
                    return next;
                });
            };

            const downloadDesignAsPng = async (d) => {
                try {
                    const canvas = await renderToCanvas({
                        platformId: d.platformId, formatId: d.formatId,
                        content: d.content, style: d.style,
                    });
                    canvas.toBlob((blob) => {
                        const safeName = (d.content?.name || 'mockup').replace(/[^a-z0-9_-]/gi, '_');
                        saveAs(blob, `${safeName}_${d.id}.png`);
                    }, 'image/png');
                } catch (e) { alert('Download mislukt: ' + e.message); }
            };

            const ensureShareToken = async (d) => {
                if (d.shareToken) return d;
                const token = (typeof crypto !== 'undefined' && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : `tok-${Date.now()}-${Math.random().toString(36).slice(2, 18)}`;
                const expires = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000); // 30 dagen
                try {
                    await apiCall(DESIGNS_STORE, 'save', toDbDesign({
                        ...d, shareToken: token, shareExpiresAt: expires.toISOString(),
                    }));
                    await refreshGallery();
                    return { ...d, shareToken: token, shareExpiresAt: expires.toISOString() };
                } catch (e) { alert('Share-link aanmaken mislukt: ' + e.message); return d; }
            };

            const revokeShare = async (d) => {
                if (!confirm('Share-link intrekken? De collega kan dan niet meer uploaden.')) return;
                try {
                    await apiCall(DESIGNS_STORE, 'save', toDbDesign({
                        ...d, shareToken: null, shareExpiresAt: null,
                    }));
                    await refreshGallery();
                    setShareModalDesign(null);
                } catch (e) { alert('Revoken mislukt: ' + e.message); }
            };

            const deleteRun = async (runId, runLabel) => {
                const designs = savedDesigns.filter(d => d.bulkRunId === runId);
                if (!designs.length) return;
                if (!confirm(`Run "${runLabel}" met ${designs.length} mockup(s) volledig verwijderen?`)) return;
                try {
                    await apiCall(DESIGNS_STORE, 'delete-many', { ids: designs.map(d => String(d.id)) });
                    await refreshGallery();
                } catch (e) { alert('Verwijderen mislukt: ' + e.message); }
            };

            // Run-level share (v3.1.1) — één link voor alle mockups in een bulk-run.
            // Token wordt op elke row van de run gezet zodat de Edge Function bij
            // share-get-run alle mockups in één keer terug kan geven.
            const ensureRunShareToken = async (runId, runLabel) => {
                const designs = savedDesigns.filter(d => d.bulkRunId === runId);
                if (!designs.length) return null;
                // Re-use existing token als alle rows er al een hebben
                const existing = designs[0].runShareToken;
                const allHaveSame = existing && designs.every(d => d.runShareToken === existing);
                if (allHaveSame) {
                    return { token: existing, expiresAt: designs[0].runShareExpiresAt, runLabel };
                }
                const token = (typeof crypto !== 'undefined' && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : `run-tok-${Date.now()}-${Math.random().toString(36).slice(2, 18)}`;
                const expires = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString();
                try {
                    // Save token op elke row van de run (sequentieel om Edge Function-limieten te respecteren)
                    for (const d of designs) {
                        await apiCall(DESIGNS_STORE, 'save', toDbDesign({
                            ...d, runShareToken: token, runShareExpiresAt: expires,
                        }));
                    }
                    await refreshGallery();
                    return { token, expiresAt: expires, runLabel };
                } catch (e) {
                    alert('Run-share aanmaken mislukt: ' + e.message);
                    return null;
                }
            };

            // Trekt een run/selectie-share-token in. Werkt voor zowel echte
            // bulk-runs (via bulkRunId-lookup) als voor losse selectie-shares
            // (waar het token op willekeurige rows staat).
            const revokeRunShare = async (token) => {
                if (!token) return;
                if (!confirm('Share-link intrekken?')) return;
                const designs = savedDesigns.filter(d => d.runShareToken === token);
                try {
                    for (const d of designs) {
                        await apiCall(DESIGNS_STORE, 'save', toDbDesign({
                            ...d, runShareToken: null, runShareExpiresAt: null,
                        }));
                    }
                    await refreshGallery();
                    setShareModalRun(null);
                } catch (e) { alert('Revoken mislukt: ' + e.message); }
            };

            // Selection actions (v3.1.2) — werken op een willekeurige set design-IDs
            const deleteSelection = async (ids) => {
                if (!ids.length) return;
                if (!confirm(`${ids.length} mockup${ids.length === 1 ? '' : 's'} verwijderen?`)) return;
                try {
                    await apiCall(DESIGNS_STORE, 'delete-many', { ids: ids.map(String) });
                    await refreshGallery();
                } catch (e) { alert('Verwijderen mislukt: ' + e.message); }
            };

            // Verplaatst geselecteerde mockups naar een nieuwe of bestaande collectie.
            // target = { type: 'new', label } | { type: 'existing', runId }
            const moveSelectionToCollection = async (ids, target) => {
                if (!ids.length || !target) return;
                let newRunId, newLabel;
                if (target.type === 'new') {
                    if (!target.label?.trim()) { alert('Vul een naam in.'); return; }
                    newRunId = (typeof crypto !== 'undefined' && crypto.randomUUID)
                        ? crypto.randomUUID()
                        : `run-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
                    newLabel = target.label.trim();
                } else if (target.type === 'existing') {
                    const existing = savedDesigns.find(d => d.bulkRunId === target.runId);
                    if (!existing) { alert('Collectie niet gevonden.'); return; }
                    newRunId = target.runId;
                    newLabel = existing.bulkRunLabel;
                } else { return; }

                try {
                    for (const id of ids) {
                        const d = savedDesigns.find(x => String(x.id) === String(id));
                        if (!d) continue;
                        await apiCall(DESIGNS_STORE, 'save', toDbDesign({
                            ...d, bulkRunId: newRunId, bulkRunLabel: newLabel,
                            // Reset run-share-token wanneer mockup naar andere run gaat
                            runShareToken: null, runShareExpiresAt: null,
                        }));
                    }
                    await refreshGallery();
                } catch (e) { alert('Verplaatsen mislukt: ' + e.message); }
            };

            // Genereert een share-link voor een willekeurige selectie. Hergebruikt
            // run_share_token: alle geselecteerde rows krijgen dezelfde token, ook
            // als ze uit verschillende collecties komen. De share-URL is dan
            // ?run=TOKEN — collega ziet exact die set mockups.
            const shareSelection = async (ids) => {
                if (!ids.length) return;
                const designs = ids.map(id => savedDesigns.find(x => String(x.id) === String(id))).filter(Boolean);
                if (!designs.length) return;

                // Waarschuw als er al run-shares actief zijn
                const conflicting = designs.filter(d => d.runShareToken);
                if (conflicting.length > 0) {
                    if (!confirm(`${conflicting.length} mockup(s) zijn al gedeeld als deel van een collectie. Een nieuwe selectie-share vervangt die. Doorgaan?`)) return;
                }

                const token = (typeof crypto !== 'undefined' && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : `sel-${Date.now()}-${Math.random().toString(36).slice(2, 18)}`;
                const expires = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString();

                try {
                    for (const d of designs) {
                        await apiCall(DESIGNS_STORE, 'save', toDbDesign({
                            ...d, runShareToken: token, runShareExpiresAt: expires,
                        }));
                    }
                    await refreshGallery();
                    // Open de RunShareModal met een gefakete "selectie"-runInfo
                    setShareModalRun({
                        runId: '__selection__' + token,
                        runLabel: `Selectie van ${designs.length} mockup${designs.length === 1 ? '' : 's'}`,
                        prefilledToken: token,
                        prefilledExpires: expires,
                    });
                } catch (e) { alert('Selectie-share aanmaken mislukt: ' + e.message); }
            };

            // Single-shot PNG download — gebruikt dezelfde renderToCanvas als de preview
            const generateCanvas = async () => {
                setLoading(true);
                await new Promise(r => setTimeout(r, 50));
                try {
                    const canvas = await renderToCanvas({ platformId, formatId, content, style });
                    canvas.toBlob((blob) => {
                        saveAs(blob, `${content.name.replace(/\s/g, '_')}_${platformId}_${formatId}.png`);
                        setLoading(false);
                    }, 'image/png');
                } catch (e) {
                    console.error(e);
                    setLoading(false);
                }
            };

            const generateBatch = async () => {
                const platforms = Object.entries(exportOpts.platforms).filter(([_, v]) => v).map(([k]) => k);
                const formats = Object.entries(exportOpts.formats).filter(([_, v]) => v).map(([k]) => k);
                const modes = Object.entries(exportOpts.modes).filter(([_, v]) => v).map(([k]) => k);

                if (!platforms.length || !formats.length || !modes.length) {
                    alert('Selecteer minimaal één platform, formaat en modus.');
                    return;
                }

                setLoading(true);
                const zip = new JSZip();
                const total = platforms.length * formats.length * modes.length;
                let done = 0;
                setBatchProgress({ done, total });

                for (const p of platforms) {
                    for (const f of formats) {
                        for (const m of modes) {
                            try {
                                const canvas = await renderToCanvas({
                                    platformId: p, formatId: f, content, style, darkMode: m === 'dark',
                                });
                                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                                zip.file(`${content.name.replace(/\s/g, '_')}_${p}_${f}_${m}.png`, blob);
                            } catch (e) { console.error('Variant failed', p, f, m, e); }
                            done++;
                            setBatchProgress({ done, total });
                        }
                    }
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, `${content.name.replace(/\s/g, '_')}_socialframe.zip`);
                setBatchProgress(null);
                setLoading(false);
            };

            // ----- RENDER -----

                                            </div>
                                            {style.bgType === 'gradient' && (
                                                <div className="h-8 w-8 rounded-full overflow-hidden border border-gray-600 relative cursor-pointer" style={{ background: style.bgColor2 }}>

                                        <option value="">Losse mockup (geen collectie)</option>
                                        <option value="__new__">+ Nieuwe collectie…</option>
                                        {(() => {

                                                    seen.set(d.bulkRunId, d.bulkRunLabel || d.bulkRunId);
                                                }
                                            }
                                            return Array.from(seen.entries()).map(([id, label]) => (
                                                <option key={id} value={id}>{label}</option>
                                            ));
                                        })()}
                                    </select>
                                    {saveTargetMode === '__new__' && (

                                            placeholder="Naam van nieuwe collectie"
                                            onChange={e => setNewCollectionName(e.target.value)}
                                            className="w-full bg-dark-800 border border-gray-700 rounded px-2 py-2 text-sm" />
                                    )}

                                    // Re-fetch gallery contents en spring naar Library/Gallery-tab

                        {sidebarTab === 'export' && (

                                    <h3 className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Platforms</h3>
                                    <div className="space-y-1.5">
                                        {Object.entries(PLATFORMS).map(([id, p]) => (
                                            <label key={id} className="flex items-center gap-2 text-sm cursor-pointer">
                                                <input type="checkbox" checked={exportOpts.platforms[id]}
                                                    onChange={e => setExportOpts(prev => ({ ...prev, platforms: { ...prev.platforms, [id]: e.target.checked } }))} />
                                                {p.name}
                                            </label>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Formaten</h3>

                                            onChange={e => setExportOpts(prev => ({ ...prev, modes: { ...prev.modes, light: e.target.checked } }))} /> Light
                                    </label>
                                    <label className="flex items-center gap-2 text-sm cursor-pointer mt-1.5">
                                        <input type="checkbox" checked={exportOpts.modes.dark}

                                    className="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-gray-200 flex items-center justify-center gap-2 text-sm">

                    <main
                        className={`flex-1 bg-black relative flex items-center justify-center p-8 checkerboard overflow-auto ${dropping ? 'dropzone-active' : ''}`}
                        onDragOver={e => { e.preventDefault(); setDropping(true); }}
                        onDragLeave={() => setDropping(false)}
                        onDrop={handleDrop}
                    >
                        <CanvasPreview platformId={platformId} formatId={formatId} content={content} style={style} />
                    </main>

                    {shareModalDesign && (
                        <ShareModal
                            design={shareModalDesign}
                            onClose={() => setShareModalDesign(null)}
                            onEnsureToken={ensureShareToken}
                            onRevoke={revokeShare}
                        />
                    )}

                    {shareModalRun && (
                        <RunShareModal
                            runInfo={shareModalRun}
                            onClose={() => setShareModalRun(null)}
                            onEnsureRunToken={ensureRunShareToken}
                            onRevokeRun={revokeRunShare}
                        />
                    )}

                    {moveModalState && (
                        <MoveCollectionModal
                            ids={moveModalState.ids}
                            designs={savedDesigns}
                            onClose={() => { moveModalState.onDone?.(); setMoveModalState(null); }}
                            onMove={moveSelectionToCollection}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
