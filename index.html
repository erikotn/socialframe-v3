        // ============== CLOUD API ==============

        const fromDbKit = (k) => ({

        // ============== HELPERS ==============
        const wrapText = (ctx, text, maxWidth) => {
            const paragraphs = String(text ?? '').split('\n');
            const lines = [];
            for (const para of paragraphs) {
                if (para === '') { lines.push(''); continue; }
                const words = para.split(' ');
                let line = words[0] ?? '';
                for (let i = 1; i < words.length; i++) {
                    const w = words[i];
                    if (ctx.measureText(line + ' ' + w).width < maxWidth) line += ' ' + w;
                    else { lines.push(line); line = w; }
                }
                lines.push(line);
            }
            return lines;
        };

        const loadImg = (src) => new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = rej;
            i.src = src;
        });

        const truncateToWidth = (ctx, text, maxW, fontStr) => {
            ctx.font = fontStr;
            if (ctx.measureText(text).width <= maxW) return text;
            let t = text;
            while (t.length > 0 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
            return t + '…';
        };

        // Resize images larger than 1500px on the long side so the JSON
        // payload stays under Supabase's Edge Function body limit (~6 MB).
        // Original format is preserved (PNG keeps transparency for logos).
        const fileToImageData = (file) => new Promise((res, rej) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const MAX = 1500;
                    let w = img.naturalWidth, h = img.naturalHeight;
                    const longest = Math.max(w, h);
                    if (longest <= MAX) {
                        return res({ src: e.target.result, width: w, height: h });
                    }
                    const scale = MAX / longest;
                    w = Math.round(w * scale);
                    h = Math.round(h * scale);
                    const c = document.createElement('canvas');
                    c.width = w; c.height = h;
                    const cx = c.getContext('2d');
                    cx.drawImage(img, 0, 0, w, h);
                    const isJpeg = file.type === 'image/jpeg' || file.type === 'image/jpg';
                    const mime = isJpeg ? 'image/jpeg' : 'image/png';
                    const compressed = isJpeg ? c.toDataURL(mime, 0.85) : c.toDataURL(mime);
                    res({ src: compressed, width: w, height: h });
                };
                img.onerror = rej;
                img.src = e.target.result;
            };
            reader.onerror = rej;
            reader.readAsDataURL(file);
        });

        // ============== RICH PLACEHOLDER (v3) ==============
        // Wanneer er geen foto is geupload maar wél een briefing-tekst voor de
        // vormgever, render een zwart vlak met:
        //   - Bovenin klein lichtgrijs cursief: image-description ("Stockphoto: ...")
        //   - Centraal groot wit: image-text (de quote/zin die op het beeld moet)
        // Returns true als rich placeholder is getekend, false als beide leeg.
        const drawRichPlaceholder = (ctx, x, y, w, h, description, text, scale) => {
            const hasDesc = description && description.trim().length > 0;
            const hasText = text && text.trim().length > 0;
            if (!hasDesc && !hasText) return false;

            // Zwart vlak
            ctx.save();
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(x, y, w, h);

            const padX = Math.max(16 * scale, w * 0.08);

            // Image-description bovenin (klein, lichtgrijs cursief)
            if (hasDesc) {
                ctx.fillStyle = '#9ca3af';
                ctx.font = `italic 400 ${11 * scale}px "Inter", sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                const descLines = wrapText(ctx, description.trim(), w - padX * 2);
                let dy = y + 16 * scale;
                for (const ln of descLines.slice(0, 3)) {
                    ctx.fillText(ln, x + padX, dy);
                    dy += 15 * scale;
                }
            }

            // Image-text gecentreerd (groter, wit)
            if (hasText) {
                ctx.fillStyle = '#ffffff';
                // Auto-size font: hoe minder tekst, hoe groter
                const charCount = text.trim().length;
                let fontSize = 22;
                if (charCount > 60) fontSize = 18;
                if (charCount > 120) fontSize = 15;
                if (charCount > 200) fontSize = 13;
                ctx.font = `600 ${fontSize * scale}px "Inter", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const lineHeight = fontSize * 1.35 * scale;
                const textLines = wrapText(ctx, text.trim(), w - padX * 2);
                const totalH = textLines.length * lineHeight;
                let ty = y + h / 2 - totalH / 2 + lineHeight / 2;
                for (const ln of textLines) {
                    ctx.fillText(ln, x + w / 2, ty);
                    ty += lineHeight;
                }
            }

            ctx.restore();
            return true;
        };

        // ============== CANVAS ICON DRAWING ==============
        const drawHeart = (ctx, cx, cy, r, color, filled = true) => {
            ctx.save();
            ctx.fillStyle = filled ? color : 'transparent';
            ctx.strokeStyle = color;
            ctx.lineWidth = r * 0.18;
            const tx = cx, ty = cy - r * 0.3;
            ctx.beginPath();
            ctx.moveTo(tx, ty + r * 0.4);
            ctx.bezierCurveTo(tx, ty, tx - r, ty, tx - r, ty + r * 0.6);
            ctx.bezierCurveTo(tx - r, ty + r, tx, ty + r * 1.5, tx, ty + r * 1.7);
            ctx.bezierCurveTo(tx, ty + r * 1.5, tx + r, ty + r, tx + r, ty + r * 0.6);
            ctx.bezierCurveTo(tx + r, ty, tx, ty, tx, ty + r * 0.4);
            ctx.closePath();
            if (filled) ctx.fill(); else ctx.stroke();
            ctx.restore();
        };

        const drawComment = (ctx, cx, cy, r, color) => {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = r * 0.18;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(cx - r * 0.3, cy + r * 0.4);
            ctx.lineTo(cx - r * 0.5, cy + r * 1.3);
            ctx.lineTo(cx + r * 0.4, cy + r * 0.7);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        };

        const drawShare = (ctx, cx, cy, r, color) => {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = r * 0.18;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(cx + r, cy - r);
            ctx.lineTo(cx - r, cy);
            ctx.lineTo(cx + r * 0.1, cy + r * 0.3);
            ctx.lineTo(cx + r, cy - r);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + r * 0.1, cy + r * 0.3);
            ctx.lineTo(cx + r * 0.3, cy + r);
            ctx.stroke();
            ctx.restore();
        };

        const drawBookmark = (ctx, cx, cy, r, color) => {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = r * 0.18;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(cx - r * 0.7, cy - r);
            ctx.lineTo(cx - r * 0.7, cy + r);
            ctx.lineTo(cx, cy + r * 0.4);
            ctx.lineTo(cx + r * 0.7, cy + r);
            ctx.lineTo(cx + r * 0.7, cy - r);

            ctx.stroke();

        // ============== ICONS (REACT) ==============
        const Icons = {

            Save: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            Trash: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>,
            Heart: ({ size = 22, fill = 'none' }) => <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
            Comment: ({ size = 22 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>,

            Bookmark: ({ size = 22 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>,
            Verified: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="#1d9bf0"><path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/></svg>,

            Briefcase: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
            Package: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="16.5" x2="7.5" y1="9.4" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" x2="12" y1="22.08" y2="12"/></svg>,

        // ============== LAYOUT METRICS ==============
        // Returns { phoneHeight, imgHeight } for given layout config
        function computeMetrics({ platform, format, content, phoneW, sliderH }) {
            if (platform.layout === 'story') {
                return { phoneHeight: sliderH, imgHeight: sliderH };
            }

            const imgAspect = content.mainImage
                ? content.mainImage.height / content.mainImage.width
                : format.imgAspect;
            const imgH = phoneW * imgAspect;

            const measureCanvas = document.createElement('canvas');
            const mctx = measureCanvas.getContext('2d');
            const safePadX = 20, lineHeight = 20, fontSize = 14;

            if (platform.layout === 'feed-cta') {
                const topSpace = 50, headerOffset = 70, gap = 10, footerH = 80, buffer = 4;
                mctx.font = `400 ${fontSize}px "Inter", sans-serif`;
                const lines = wrapText(mctx, content.text, phoneW - safePadX * 2);
                const textH = lines.length * lineHeight;
                const contentH = topSpace + headerOffset + textH + gap + imgH + footerH + buffer;
                return { phoneHeight: Math.max(sliderH, Math.ceil(contentH)), imgHeight: imgH };
            }

            if (platform.layout === 'feed-icons') {
                const topSpace = 50, headerOffset = 60, iconRowH = 50, likesH = 22, gap = 6, buffer = 12;
                mctx.font = `400 12px "Inter", sans-serif`;
                const captionLines = wrapText(mctx, content.name + ' ' + content.text, phoneW - safePadX * 2);
                const captionH = captionLines.length * 18;
                const contentH = topSpace + headerOffset + imgH + iconRowH + likesH + gap + captionH + buffer;
                return { phoneHeight: Math.max(sliderH, Math.ceil(contentH)), imgHeight: imgH };
            }

            return { phoneHeight: sliderH, imgHeight: imgH };
        }

        // ============== CANVAS RENDERERS ==============
        async function renderFeedCTA(ctx, p) {
            const { scale, phoneX, phoneY, phoneW, safeX, safeW, content, platform, darkMode, imgH, fontBold, fontReg } = p;
            let currentY = p.currentY;

            const headerOffset = 70 * scale;
            const avatarSize = 40 * scale;
            const mainImg = content.mainImage ? await loadImg(content.mainImage.src) : null;
            const avatarImg = content.avatar ? await loadImg(content.avatar.src) : null;

            // Avatar
            ctx.save();
            ctx.beginPath();
            if (platform.avatarShape === 'circle') {
                ctx.arc(safeX + avatarSize / 2, currentY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
            } else {
                const r = 8 * scale;
                if (ctx.roundRect) ctx.roundRect(safeX, currentY, avatarSize, avatarSize, r);
                else ctx.rect(safeX, currentY, avatarSize, avatarSize);
            }
            ctx.closePath();
            ctx.clip();
            if (avatarImg) ctx.drawImage(avatarImg, safeX, currentY, avatarSize, avatarSize);
            else { ctx.fillStyle = '#ccc'; ctx.fillRect(safeX, currentY, avatarSize, avatarSize); }
            ctx.restore();

            // Name + verified
            ctx.fillStyle = darkMode ? '#fff' : '#000';
            ctx.font = fontBold(14);
            ctx.textAlign = 'left';
            const nameX = safeX + avatarSize + 10 * scale;
            ctx.fillText(content.name, nameX, currentY + 15 * scale);
            if (content.verified) {
                const nameW = ctx.measureText(content.name).width;
                drawVerified(ctx, nameX + nameW + 4 * scale, currentY + 4 * scale, 7 * scale);
            }

            ctx.fillStyle = '#a1a1aa';
            ctx.font = fontReg(11);
            ctx.fillText(`${platform.sponsorLabel} • 2u`, nameX, currentY + 32 * scale);

            ctx.fillStyle = darkMode ? '#fff' : '#000';
            ctx.font = fontBold(14);
            ctx.fillText('...', phoneX + phoneW - 30 * scale, currentY + 20 * scale);

            currentY += headerOffset;

            // Post text
            ctx.fillStyle = darkMode ? '#fff' : '#18181b';
            ctx.font = fontReg(14);
            const lineHeight = 20 * scale;
            const textLines = wrapText(ctx, content.text, safeW);
            for (const ln of textLines) {
                ctx.fillText(ln, safeX, currentY);
                currentY += lineHeight;
            }
            currentY += 10 * scale;

            // Image (of rich placeholder met briefing-tekst)
            if (mainImg) {
                ctx.drawImage(mainImg, phoneX, currentY, phoneW, imgH);
            } else if (!drawRichPlaceholder(ctx, phoneX, currentY, phoneW, imgH, content.imageDescription, content.imageText, scale)) {
                ctx.fillStyle = '#27272a';
                ctx.fillRect(phoneX, currentY, phoneW, imgH);
            }
            currentY += imgH;

            // Footer block
            const footerH = 80 * scale;
            ctx.fillStyle = darkMode ? '#27272a' : '#f4f4f5';
            ctx.fillRect(phoneX, currentY, phoneW, footerH);

            // Button (auto-sized to text)
            ctx.font = fontBold(12);
            const btnPadX = 12 * scale;
            const btnTextW = ctx.measureText(content.buttonText).width;
            const btnW = btnTextW + btnPadX * 2;
            const btnH = 32 * scale;
            const btnX = phoneX + phoneW - 20 * scale - btnW;
            const btnY = currentY + (footerH - btnH) / 2;

            const textMaxW = btnX - safeX - 12 * scale;

            // Headline + URL with truncation
            ctx.fillStyle = darkMode ? '#fff' : '#000';
            ctx.textAlign = 'left';
            ctx.fillText(truncateToWidth(ctx, content.headline, textMaxW, fontBold(13)), safeX, currentY + 30 * scale);
            ctx.fillStyle = '#71717a';
            ctx.fillText(truncateToWidth(ctx, content.url, textMaxW, fontReg(11)), safeX, currentY + 50 * scale);

            // Button background
            const bs = platform.buttonStyle;
            if (bs.bg !== 'transparent') {
                ctx.fillStyle = bs.bg;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(btnX, btnY, btnW, btnH, 4 * scale);
                else ctx.rect(btnX, btnY, btnW, btnH);
                ctx.fill();
            }
            if (bs.border !== 'transparent') {
                ctx.strokeStyle = bs.border;
                ctx.lineWidth = 1.5 * scale;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(btnX, btnY, btnW, btnH, 4 * scale);
                else ctx.rect(btnX, btnY, btnW, btnH);
                ctx.stroke();
            }

            ctx.fillStyle = bs.text;
            ctx.font = fontBold(12);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(content.buttonText, btnX + btnW / 2, btnY + btnH / 2);
            ctx.textBaseline = 'alphabetic';
        }

        async function renderFeedIcons(ctx, p) {
            const { scale, phoneX, phoneY, phoneW, safeX, safeW, content, platform, darkMode, imgH, fontBold, fontReg } = p;
            let currentY = p.currentY;

            const headerOffset = 60 * scale;
            const avatarSize = 36 * scale;
            const mainImg = content.mainImage ? await loadImg(content.mainImage.src) : null;
            const avatarImg = content.avatar ? await loadImg(content.avatar.src) : null;

            // Header avatar
            ctx.save();
            ctx.beginPath();
            ctx.arc(safeX + avatarSize / 2, currentY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            if (avatarImg) ctx.drawImage(avatarImg, safeX, currentY, avatarSize, avatarSize);
            else { ctx.fillStyle = '#ccc'; ctx.fillRect(safeX, currentY, avatarSize, avatarSize); }
            ctx.restore();

            // Name + verified
            ctx.fillStyle = darkMode ? '#fff' : '#000';
            ctx.font = fontBold(13);
            ctx.textAlign = 'left';
            const nameX = safeX + avatarSize + 10 * scale;
            ctx.fillText(content.name, nameX, currentY + 14 * scale);
            if (content.verified) {
                const nameW = ctx.measureText(content.name).width;
                drawVerified(ctx, nameX + nameW + 4 * scale, currentY + 3 * scale, 6 * scale);
            }

            ctx.fillStyle = '#a1a1aa';
            ctx.font = fontReg(10);
            ctx.fillText(platform.sponsorLabel, nameX, currentY + 28 * scale);

            ctx.fillStyle = darkMode ? '#fff' : '#000';
            ctx.font = fontBold(14);
            ctx.fillText('...', phoneX + phoneW - 30 * scale, currentY + 18 * scale);

            currentY += headerOffset;

            // Image (full width, height per format), of rich placeholder
            if (mainImg) {
                ctx.drawImage(mainImg, phoneX, currentY, phoneW, imgH);
            } else if (!drawRichPlaceholder(ctx, phoneX, currentY, phoneW, imgH, content.imageDescription, content.imageText, scale)) {
                ctx.fillStyle = '#27272a';
                ctx.fillRect(phoneX, currentY, phoneW, imgH);
            }
            currentY += imgH;

            // Icon row
            const iconRowH = 50 * scale;
            const iconY = currentY + iconRowH / 2;
            const iconColor = darkMode ? '#fff' : '#000';
            const iconR = 11 * scale;

            drawHeart(ctx, safeX + iconR, iconY, iconR, iconColor, false);
            drawComment(ctx, safeX + iconR + 30 * scale, iconY, iconR, iconColor);
            drawShare(ctx, safeX + iconR + 60 * scale, iconY, iconR, iconColor);
            drawBookmark(ctx, phoneX + phoneW - 22 * scale, iconY, iconR, iconColor);

            currentY += iconRowH;

            // Likes count
            ctx.fillStyle = darkMode ? '#fff' : '#000';
            ctx.font = fontBold(12);
            ctx.textAlign = 'left';
            ctx.fillText(`${(content.likes ?? 0).toLocaleString('nl-NL')} vind-ik-leuks`, safeX, currentY + 8 * scale);
            currentY += 22 * scale;

            // Caption (name bold + text)
            ctx.font = fontReg(12);
            const capLineH = 18 * scale;

            // First line: name bold + text continuation
            ctx.font = fontBold(12);
            const nameWidth = ctx.measureText(content.name).width;
            ctx.fillStyle = darkMode ? '#fff' : '#000';
            ctx.fillText(content.name, safeX, currentY);
            const remainingX = safeX + nameWidth + (4 * scale);
            const remainingW = phoneW - 40 * scale - nameWidth - (4 * scale);

            ctx.font = fontReg(12);
            // Wrap remaining text on first line + subsequent full-width lines
            const words = content.text.split(' ');
            let firstLine = '';
            let i = 0;
            for (; i < words.length; i++) {
                const test = firstLine ? firstLine + ' ' + words[i] : words[i];
                if (ctx.measureText(test).width > remainingW) break;
                firstLine = test;
            }
            ctx.fillText(firstLine, remainingX, currentY);
            currentY += capLineH;

            // Remaining words wrap to safeW
            if (i < words.length) {
                const rest = words.slice(i).join(' ');
                const restLines = wrapText(ctx, rest, safeW);
                for (const ln of restLines) {
                    ctx.fillText(ln, safeX, currentY);
                    currentY += capLineH;
                }
            }

            // "Bekijk alle X reacties" (if any)
            if ((content.comments ?? 0) > 0) {
                currentY += 2 * scale;
                ctx.fillStyle = '#71717a';
                ctx.font = fontReg(11);
                ctx.fillText(`Bekijk alle ${content.comments} reacties`, safeX, currentY);
            }
        }

        async function renderStory(ctx, p) {
            const { scale, phoneX, phoneY, phoneW, phoneH, safeX, content, platform, fontBold, fontReg } = p;
            const mainImg = content.mainImage ? await loadImg(content.mainImage.src) : null;
            const avatarImg = content.avatar ? await loadImg(content.avatar.src) : null;

            if (mainImg) {
                const ratio = mainImg.width / mainImg.height;
                const targetRatio = phoneW / phoneH;
                let sw, sh, sx, sy;
                if (ratio > targetRatio) { sh = mainImg.height; sw = sh * targetRatio; sy = 0; sx = (mainImg.width - sw) / 2; }
                else { sw = mainImg.width; sh = sw / targetRatio; sx = 0; sy = (mainImg.height - sh) / 2; }
                ctx.drawImage(mainImg, sx, sy, sw, sh, phoneX, phoneY, phoneW, phoneH);
            } else if (!drawRichPlaceholder(ctx, phoneX, phoneY, phoneW, phoneH, content.imageDescription, content.imageText, scale)) {
                ctx.fillStyle = '#27272a';
                ctx.fillRect(phoneX, phoneY, phoneW, phoneH);
            }

            // Bottom gradient overlay
            const grd = ctx.createLinearGradient(0, phoneY + phoneH / 2, 0, phoneY + phoneH);
            grd.addColorStop(0, 'transparent');
            grd.addColorStop(1, 'rgba(0,0,0,0.8)');
            ctx.fillStyle = grd;
            ctx.fillRect(phoneX, phoneY + phoneH / 2, phoneW, phoneH / 2);

            // Top: avatar + name
            const avatarSize = 32 * scale;
            const topY = phoneY + 50 * scale;

            ctx.save();
            ctx.beginPath();
            ctx.arc(safeX + avatarSize / 2, topY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
            ctx.clip();
            if (avatarImg) ctx.drawImage(avatarImg, safeX, topY, avatarSize, avatarSize);
            else { ctx.fillStyle = '#ccc'; ctx.fillRect(safeX, topY, avatarSize, avatarSize); }
            ctx.restore();

            ctx.fillStyle = '#fff';
            ctx.font = fontBold(13);
            ctx.textAlign = 'left';
            const nameX = safeX + avatarSize + 10 * scale;
            ctx.fillText(content.name, nameX, topY + 20 * scale);
            if (content.verified) {
                const nameW = ctx.measureText(content.name).width;
                drawVerified(ctx, nameX + nameW + 4 * scale, topY + 9 * scale, 6 * scale);
            }
            ctx.font = fontReg(11);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillText(platform.sponsorLabel, nameX, topY + 36 * scale);

            // Side icons
            const iconX = phoneX + phoneW - 30 * scale;
            const iconYStart = phoneY + phoneH - 160 * scale;
            const iconGap = 50 * scale;
            const iconR = 12 * scale;

            drawHeart(ctx, iconX, iconYStart, iconR, '#fff', false);
            ctx.fillStyle = '#fff';
            ctx.font = fontReg(11);
            ctx.textAlign = 'center';
            ctx.fillText((content.likes ?? 0).toLocaleString('nl-NL'), iconX, iconYStart + 22 * scale);

            drawComment(ctx, iconX, iconYStart + iconGap, iconR, '#fff');
            ctx.fillText((content.comments ?? 0).toString(), iconX, iconYStart + iconGap + 22 * scale);

            drawShare(ctx, iconX, iconYStart + iconGap * 2, iconR, '#fff');
            ctx.fillText((content.shares ?? 0).toString(), iconX, iconYStart + iconGap * 2 + 22 * scale);

            // CTA pill at the bottom
            const ctaW = phoneW - 40 * scale;
            const ctaH = 36 * scale;
            const ctaX = phoneX + 20 * scale;
            const ctaY = phoneY + phoneH - 56 * scale;
            const bs = platform.buttonStyle;
            ctx.fillStyle = bs.bg === 'transparent' ? '#fff' : bs.bg;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(ctaX, ctaY, ctaW, ctaH, 6 * scale);
            else ctx.rect(ctaX, ctaY, ctaW, ctaH);
            ctx.fill();

            ctx.fillStyle = bs.text;
            ctx.font = fontBold(13);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(content.buttonText, ctaX + ctaW / 2, ctaY + ctaH / 2);
            ctx.textBaseline = 'alphabetic';
        }

        // ============== STANDALONE renderToCanvas ==============
        // Pure function: same input → same canvas. Used voor zowel preview als download
        // zodat WYSIWYG gegarandeerd is (eerder dreven preview en export uit elkaar).
        async function renderToCanvas({ platformId, formatId, content, style, darkMode }) {
            const usePlatform = PLATFORMS[platformId];
            const useFormat = FORMATS[formatId];
            const useDarkMode = darkMode ?? style.darkMode;

            const scale = 2;
            const phoneW_orig = style.phoneWidth;
            const m = computeMetrics({
                platform: usePlatform, format: useFormat, content,
                phoneW: phoneW_orig, sliderH: style.phoneHeight,
            });
            const phoneH_orig = m.phoneHeight;
            const imgH_orig = m.imgHeight;

            const phoneW = phoneW_orig * scale;
            const phoneH = phoneH_orig * scale;
            const pad = style.padding * scale;
            const canvasW = phoneW + pad * 2;
            const canvasH = phoneH + pad * 2;

            const canvas = document.createElement('canvas');
            canvas.width = canvasW;
            canvas.height = canvasH;
            const ctx = canvas.getContext('2d');

            if (style.bgType === 'solid') {
                ctx.fillStyle = style.bgColor1;
                ctx.fillRect(0, 0, canvasW, canvasH);
            } else if (style.bgType === 'gradient') {
                const grd = ctx.createLinearGradient(0, 0, canvasW, canvasH);
                grd.addColorStop(0, style.bgColor1);
                grd.addColorStop(1, style.bgColor2);
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, canvasW, canvasH);
            } else {
                ctx.clearRect(0, 0, canvasW, canvasH);
            }

            const phoneX = pad, phoneY = pad;
            const radius = 40 * scale;

            if (style.deviceFrame === 'shadow') {
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 40 * scale;
                ctx.shadowOffsetY = 20 * scale;
            }

            ctx.fillStyle = useDarkMode ? '#000' : '#fff';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(phoneX, phoneY, phoneW, phoneH, radius);
            else ctx.rect(phoneX, phoneY, phoneW, phoneH);
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            if (style.deviceFrame === 'outline') {
                ctx.lineWidth = 1.5 * scale;
                ctx.strokeStyle = '#d4d4d8';
                ctx.stroke();
            }

            ctx.save();
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(phoneX, phoneY, phoneW, phoneH, radius);
            else ctx.rect(phoneX, phoneY, phoneW, phoneH);
            ctx.clip();

            const fontBold = (sz) => `600 ${sz * scale}px "Inter", sans-serif`;
            const fontReg = (sz) => `400 ${sz * scale}px "Inter", sans-serif`;

            ctx.fillStyle = (usePlatform.layout === 'story' || useDarkMode) ? '#fff' : '#000';
            ctx.font = fontBold(12);
            ctx.fillText('12:00', phoneX + 30 * scale, phoneY + 30 * scale);

            const safeX = phoneX + 20 * scale;
            const safeW = phoneW - 40 * scale;
            const currentY = phoneY + 50 * scale;

            const renderArgs = {
                scale, phoneX, phoneY, phoneW, phoneH, safeX, safeW, currentY,
                content, style, platform: usePlatform, darkMode: useDarkMode,
                imgH: imgH_orig * scale, fontBold, fontReg,
            };

            if (usePlatform.layout === 'feed-cta') await renderFeedCTA(ctx, renderArgs);
            else if (usePlatform.layout === 'feed-icons') await renderFeedIcons(ctx, renderArgs);
            else if (usePlatform.layout === 'story') await renderStory(ctx, renderArgs);

            ctx.restore();

            const notchW = 100 * scale, notchH = 25 * scale;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(phoneX + (phoneW - notchW) / 2, phoneY + 10 * scale, notchW, notchH, 12 * scale);
            else ctx.rect(phoneX + (phoneW - notchW) / 2, phoneY + 10 * scale, notchW, notchH);
            ctx.fill();

            return canvas;
        }

        // ============== PREVIEW (canvas → image) ==============
        // Re-rendert canvas op elke state-change; toont resultaat als <img>.
        // Garandeert dat preview === export (geen drift mogelijk).
        function CanvasPreview({ platformId, formatId, content, style }) {
            const [src, setSrc] = useState(null);
            useEffect(() => {
                let cancelled = false;
                (async () => {
                    try {
                        const canvas = await renderToCanvas({ platformId, formatId, content, style });
                        if (cancelled) return;
                        setSrc(canvas.toDataURL('image/png'));
                    } catch (e) { console.error('Preview render error:', e); }
                })();
                return () => { cancelled = true; };
            }, [platformId, formatId, content, style]);

            if (!src) return <div className="text-gray-500 text-sm">Mockup wordt opgebouwd…</div>;
            return <img src={src} className="max-w-full max-h-full" alt="Mockup preview" />;
        }

        // ============== PASSWORD GATE ==============
        // ============== BULK PANEL (v3) ==============
        // Genereer veel mockups uit een TSV-spreadsheet (geplakt vanuit Sheets/Claude).
        //
        // Twee modi:
        //   - Simple: brand/platform/format/frame staan boven de TSV (1× ingesteld).
        //     TSV-kolommen: naam, posttekst, headline, knop, url, image_filename,
        //                    image_description, image_text
        //   - Advanced: alle kolommen per rij (incl. brand/platform/format/frame).
        //     TSV-kolommen: brand, platform, format, frame, naam, posttekst, headline,
        //                    knop, url, image_filename, image_description, image_text
        //
        // image_filename matcht tegen files die in de drop-zone gesleept zijn.
        // Als leeg + image_description/text: rich placeholder. Als leeg + niets:
        // grijs vlak.

        const BULK_HEADERS_SIMPLE = ['naam', 'posttekst', 'headline', 'knop', 'url', 'image_filename', 'image_description', 'image_text'];
        const BULK_HEADERS_ADVANCED = ['brand', 'platform', 'format', 'frame', ...BULK_HEADERS_SIMPLE];

        // Parse pasted TSV. Tolerant for extra/missing columns.
        // Returns { rows: [{rowNum, data, errors[], warnings[]}], headerError? }
        const parseTSV = (text, mode, simpleDefaults, brandKits) => {
            if (!text || !text.trim()) return { rows: [], headerError: 'Geen TSV-data geplakt.' };

            const lines = text.replace(/\r\n/g, '\n').split('\n').filter(l => l.trim().length > 0);
            if (lines.length < 2) return { rows: [], headerError: 'TSV moet minstens een header-rij + 1 data-rij hebben.' };

            const headerCells = lines[0].split('\t').map(c => c.trim().toLowerCase());
            const expected = mode === 'simple' ? BULK_HEADERS_SIMPLE : BULK_HEADERS_ADVANCED;
            const missing = expected.filter(h => !headerCells.includes(h));
            // We staan ook toe dat sommige verplichte velden ontbreken (bv. headline) — die krijgen lege default.
            // Maar als alle expected ontbreken, gaat het mis.
            if (missing.length === expected.length) {
                return { rows: [], headerError: `Headers herkend: [${headerCells.join(', ')}]. Verwacht: [${expected.join(', ')}].` };
            }

            const idx = (col) => headerCells.indexOf(col);

            const lookupBrand = (name) => {
                if (!name) return null;
                const lc = name.trim().toLowerCase();
                return brandKits.find(k => k.name?.toLowerCase() === lc || k.senderName?.toLowerCase() === lc);
            };

            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const cells = lines[i].split('\t');
                const get = (col) => {
                    const j = idx(col);
                    return j >= 0 ? (cells[j] ?? '').trim() : '';
                };
                const errors = [];
                const warnings = [];

                let brand = null;
                let platformId, formatId, frame;
                if (mode === 'simple') {
                    brand = simpleDefaults.brand;
                    platformId = simpleDefaults.platformId;
                    formatId = simpleDefaults.formatId;
                    frame = simpleDefaults.frame;
                } else {
                    const brandName = get('brand');
                    brand = lookupBrand(brandName);
                    if (!brand) errors.push(`Brand '${brandName}' niet gevonden`);

                    platformId = get('platform').toLowerCase();
                    if (!PLATFORMS[platformId]) {
                        warnings.push(`Platform '${platformId}' onbekend → 'linkedin'`);
                        platformId = 'linkedin';
                    }
                    formatId = get('format').toLowerCase();
                    if (!FORMATS[formatId]) {
                        warnings.push(`Format '${formatId}' onbekend → 'feed-4-5'`);
                        formatId = 'feed-4-5';
                    }
                    frame = get('frame').toLowerCase() || 'shadow';
                    if (!['none', 'shadow', 'outline'].includes(frame)) {
                        warnings.push(`Frame '${frame}' onbekend → 'shadow'`);
                        frame = 'shadow';
                    }
                }

                rows.push({
                    rowNum: i,
                    skip: false,
                    brand,
                    platformId,
                    formatId,
                    frame,
                    fields: {
                        naam: get('naam'),
                        posttekst: get('posttekst'),
                        headline: get('headline'),
                        knop: get('knop'),
                        url: get('url'),
                        image_filename: get('image_filename'),
                        image_description: get('image_description'),
                        image_text: get('image_text'),
                    },
                    errors,
                    warnings,
                });
            }

            return { rows, headerError: null };
        };

        // Build a content+style object voor één bulk-rij, klaar voor renderToCanvas
        const buildContentForRow = (row, bulkImages, sharedImage) => {
            const f = row.fields;
            const brand = row.brand;
            // image-resolutie: filename match → use; anders: niets (laat rich placeholder of grijs vlak doen)
            let mainImage = null;
            const fname = (f.image_filename || '').trim();
            if (fname && bulkImages[fname]) {
                mainImage = bulkImages[fname];
            } else if (!fname && sharedImage) {
                // In simple-mode: gedeelde foto wordt overal gebruikt waar geen filename staat
                mainImage = sharedImage;
            }

            // Sender-name + avatar + verified komen ALTIJD uit de brand-kit.
            // 'naam' in TSV is een variant-label (filename + validatie-preview),
            // niet de afzendernaam in de mockup.
            const content = {
                avatar: brand?.avatar || null,
                mainImage,
                name: brand?.senderName || brand?.name || 'Brand',
                text: f.posttekst || '',
                headline: f.headline || '',
                buttonText: f.knop || 'Lees meer',
                url: f.url || brand?.url || '',
                verified: !!brand?.verified,
                likes: 124, comments: 12, shares: 4,
                imageDescription: f.image_description || '',
                imageText: f.image_text || '',
            };
            const style = {
                bgColor1: '#ffffff',
                bgColor2: '#f4f4f5',
                bgType: 'solid',
                padding: 40,
                darkMode: false,
                deviceFrame: row.frame || 'shadow',
                phoneWidth: 360,
                phoneHeight: 700,
            };
            return { content, style };
        };

        const buildClaudePrompt = (mode, simpleDefaults, brandKits) => {
            const brandName = simpleDefaults.brand?.name || simpleDefaults.brand?.senderName || '<brand>';
            if (mode === 'simple') {
                return `Genereer SocialFrame-mockup-varianten als TSV (tabs als scheidingsteken).

Brand: ${brandName} | Platform: ${simpleDefaults.platformId} | Format: ${simpleDefaults.formatId}

Headers (verplicht in deze volgorde, gescheiden door tabs):
${BULK_HEADERS_SIMPLE.join('\t')}

Kolommen-uitleg:
- naam = variant-label (verschijnt alleen in de bestandsnaam, NIET als afzender in de mockup). Bv. "Concept_1_Post_1" of "Variant_A".
- posttekst = de tekst boven de foto in de post
- headline = vetgedrukte titel onder de foto in het CTA-blok
- knop = knop-tekst (bv. "Lees meer")
- url = website-URL onder de headline (laat leeg om brand-URL te gebruiken)
- image_filename = laat leeg in deze batch
- image_description = korte briefing voor de vormgever ("Stockphoto: ...")
- image_text = de zin/quote die in/op het beeld komt (1-2 regels, max 80 tekens)

Variaties: telkens een andere headline-angle voor de campagne.
Posttekst max 80 woorden, headline max 60 tekens, knop = "Lees meer".

Afzendernaam en avatar komen automatisch uit de brand-kit (${brandName}) — niet zelf invullen.

Geef alleen TSV (incl. header-rij), geen uitleg eromheen.`;
            }
            const brandsList = brandKits.map(k => k.name || k.senderName).filter(Boolean).join(', ');
            return `Genereer SocialFrame-mockup-varianten als TSV (tabs als scheidingsteken).

Headers (verplicht in deze volgorde, gescheiden door tabs):
${BULK_HEADERS_ADVANCED.join('\t')}

Beschikbare brands: ${brandsList || '<vul handmatig>'}
Beschikbare platforms: linkedin, meta, instagram, tiktok
Beschikbare formats: feed-4-5, feed-1-1, feed-1-91, story-9-16
Frame: shadow / outline / none

Kolommen-uitleg:
- brand = brand-kit-naam (afzender + avatar komen daaruit)
- naam = variant-label (alleen voor bestandsnaam)
- image_filename = laat leeg of zet een filename die apart wordt geupload
- image_description = briefing voor de vormgever
- image_text = tekst die op het beeld komt

Geef alleen TSV (incl. header-rij), geen uitleg eromheen.`;
        };

        // ============== GALLERY PANEL (v3.1) ==============
        // Toont opgeslagen mockups gegroepeerd per bulk-run. Ungrouped (single
        // saves zonder bulk_run_id) staan bovenaan. Per item: status-badge,
        // share-knop, download-knop, delete-knop.
        function GalleryPanel({ designs, expandedRuns, toggleRunExpand, onLoad, onDelete, onDeleteRun, onShare, onShareRun, onDownload, onRefresh, refreshing, onShareSelection, onMoveSelection, onDeleteSelection }) {
            // Multi-select binnen de gallery: een willekeurige selectie kan
            // verwijderd, verplaatst, of als één share-link gedeeld worden.
            const [selectedIds, setSelectedIds] = useState(new Set());

            const toggleSelect = (id) => {
                setSelectedIds(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id); else next.add(id);
                    return next;
                });
            };

            const toggleSelectRun = (g) => {
                setSelectedIds(prev => {
                    const next = new Set(prev);
                    const allSelected = g.items.every(i => next.has(i.id));
                    if (allSelected) for (const i of g.items) next.delete(i.id);
                    else for (const i of g.items) next.add(i.id);
                    return next;
                });
            };

            const clearSelection = () => setSelectedIds(new Set());
            // Group designs by bulkRunId
            const groups = useMemo(() => {
                const ungrouped = [];
                const byRun = new Map(); // runId → { label, items, latestDate }
                for (const d of designs) {
                    if (d.bulkRunId) {
                        if (!byRun.has(d.bulkRunId)) {
                            byRun.set(d.bulkRunId, {
                                runId: d.bulkRunId,
                                label: d.bulkRunLabel || d.bulkRunId,
                                items: [],
                                latestCreatedAt: d.createdAt || '',
                            });
                        }
                        const g = byRun.get(d.bulkRunId);
                        g.items.push(d);
                        if ((d.createdAt || '') > g.latestCreatedAt) g.latestCreatedAt = d.createdAt;
                    } else {
                        ungrouped.push(d);
                    }
                }
                // Sort runs by latestCreatedAt desc
                const runs = Array.from(byRun.values()).sort((a, b) => (b.latestCreatedAt || '').localeCompare(a.latestCreatedAt || ''));
                return { ungrouped, runs };
            }, [designs]);

            const totalCount = designs.length;
            const awaitingCount = designs.filter(d => d.awaitingPhoto).length;

            const Badge = ({ d }) => {
                if (d.shareToken) return <span className="text-[9px] px-1.5 py-0.5 rounded bg-blue-900/50 text-blue-300 whitespace-nowrap">🔗 gedeeld</span>;
                if (d.awaitingPhoto) return <span className="text-[9px] px-1.5 py-0.5 rounded bg-yellow-900/50 text-yellow-300 whitespace-nowrap">📷 wacht op foto</span>;
                if (d.content?.mainImage) return <span className="text-[9px] px-1.5 py-0.5 rounded bg-green-900/40 text-green-300 whitespace-nowrap">✓ compleet</span>;
                return null;
            };

            const renderItem = (d) => {
                const isSelected = selectedIds.has(d.id);
                return (
                    <div key={d.id} className={`bg-dark-700 border rounded-lg p-2.5 transition-colors ${isSelected ? 'border-blue-500 bg-blue-900/10' : 'border-white/5 hover:border-blue-500'}`}>
                        <div className="flex gap-2.5 items-start">
                            <input type="checkbox" checked={isSelected}
                                onChange={() => toggleSelect(d.id)}
                                className="mt-1 flex-shrink-0 cursor-pointer" />
                            <div onClick={() => onLoad(d)} className="w-12 h-12 rounded bg-gray-800 flex-shrink-0 overflow-hidden cursor-pointer">
                                {d.content?.mainImage?.src ? (
                                    <img src={d.content.mainImage.src} className="w-full h-full object-cover" />
                                ) : (
                                    <div className="w-full h-full flex items-center justify-center text-gray-600 text-[8px]">
                                        {d.awaitingPhoto ? '📷' : <Icons.Image />}
                                    </div>
                                )}
                            </div>
                            <div className="flex-1 min-w-0" onClick={() => onLoad(d)} style={{ cursor: 'pointer' }}>
                                <div className="flex items-center gap-1.5 mb-0.5">
                                    <span className="text-[9px] font-bold text-gray-400 uppercase">{PLATFORMS[d.platformId]?.name || 'Feed'}</span>
                                    <Badge d={d} />
                                </div>
                                <p className="text-xs font-medium truncate">{d.content?.headline || d.content?.text?.slice(0, 40) || d.content?.name || '(leeg)'}</p>
                                <p className="text-[10px] text-gray-500 truncate">{d.content?.name}</p>
                            </div>
                        </div>
                        <div className="flex gap-1 mt-2 text-[10px]">
                            <button onClick={() => onShare(d)} className="flex-1 bg-dark-800 hover:bg-dark-900 px-2 py-1 rounded text-gray-300">🔗 Deel</button>
                            <button onClick={() => onDownload(d)} className="flex-1 bg-dark-800 hover:bg-dark-900 px-2 py-1 rounded text-gray-300">⬇ PNG</button>
                            <button onClick={() => { if (confirm('Mockup verwijderen?')) onDelete(d.id); }} className="bg-dark-800 hover:bg-red-900/50 px-2 py-1 rounded text-gray-500 hover:text-red-300">🗑</button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="p-4 space-y-3 animate-fade-in flex-grow overflow-y-auto">
                    <div className="flex items-center justify-between">
                        <div className="text-[11px] text-gray-400">
                            {totalCount} mockup{totalCount === 1 ? '' : 's'}
                            {awaitingCount > 0 && <span className="text-yellow-400"> · {awaitingCount} wacht op foto</span>}
                        </div>
                        <button onClick={onRefresh} disabled={refreshing}
                            className="text-[10px] bg-dark-700 hover:bg-dark-900 px-2 py-1 rounded text-gray-400 disabled:opacity-50">
                            {refreshing ? '…' : '↻ Refresh'}
                        </button>
                    </div>

                    {totalCount === 0 && (
                        <div className="text-center text-gray-500 py-10 text-sm">
                            Nog geen mockups in de gallery.<br/>
                            <span className="text-[11px] text-gray-600">Sla iets op via Edit-tab of genereer een batch via Bulk-tab.</span>
                        </div>
                    )}

                    {/* Ungrouped (single saves) */}
                    {groups.ungrouped.length > 0 && (
                        <div className="space-y-2">
                            <div className="text-[10px] font-bold text-gray-500 uppercase tracking-wider px-1">Losse mockups</div>
                            {groups.ungrouped.map(renderItem)}
                        </div>
                    )}

                    {/* Bulk-run groups */}
                    {groups.runs.map(g => {
                        const isOpen = expandedRuns.has(g.runId);
                        const awaiting = g.items.filter(i => i.awaitingPhoto).length;
                        const allSelected = g.items.length > 0 && g.items.every(i => selectedIds.has(i.id));
                        return (
                            <div key={g.runId} className="bg-dark-900/50 rounded-lg border border-white/5 overflow-hidden">
                                <div className="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-dark-700/50"
                                    onClick={() => toggleRunExpand(g.runId)}>
                                    <input type="checkbox" checked={allSelected}
                                        onChange={(e) => { e.stopPropagation(); toggleSelectRun(g); }}
                                        onClick={(e) => e.stopPropagation()}
                                        title="Selecteer hele collectie"
                                        className="cursor-pointer" />
                                    <span className="text-gray-400 text-[10px]">{isOpen ? '▼' : '▶'}</span>
                                    <div className="flex-1 min-w-0">
                                        <div className="text-sm font-medium truncate">{g.label}</div>
                                        <div className="text-[10px] text-gray-500">
                                            {g.items.length} mockups
                                            {awaiting > 0 && <span className="text-yellow-400"> · {awaiting} wacht op foto</span>}
                                        </div>
                                    </div>
                                    <button onClick={(e) => { e.stopPropagation(); onShareRun(g.runId, g.label); }}
                                        className="text-[9px] text-gray-300 hover:text-blue-300 px-2 py-1 whitespace-nowrap">🔗 deel run</button>
                                    <button onClick={(e) => { e.stopPropagation(); onDeleteRun(g.runId, g.label); }}
                                        className="text-[9px] text-gray-500 hover:text-red-300 px-2 py-1 whitespace-nowrap">🗑 hele run</button>
                                </div>
                                {isOpen && (
                                    <div className="p-2 space-y-2 border-t border-white/5">
                                        {g.items.map(renderItem)}
                                    </div>
                                )}
                            </div>
                        );
                    })}

                    {/* Floating action bar voor selectie (v3.1.2) */}
                    {selectedIds.size > 0 && (
                        <div className="sticky bottom-0 -mx-4 -mb-4 px-4 py-3 bg-dark-700 border-t border-blue-500/50 shadow-2xl">
                            <div className="text-[11px] text-gray-300 mb-2">
                                {selectedIds.size} geselecteerd
                            </div>
                            <div className="grid grid-cols-2 gap-1.5">
                                <button onClick={() => onShareSelection(Array.from(selectedIds))}
                                    className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1.5 rounded text-[11px]">🔗 Deel selectie</button>
                                <button onClick={() => onMoveSelection(Array.from(selectedIds), () => clearSelection())}
                                    className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-1.5 rounded text-[11px]">📁 Verplaats…</button>
                                <button onClick={async () => { await onDeleteSelection(Array.from(selectedIds)); clearSelection(); }}
                                    className="bg-red-600/70 hover:bg-red-600 text-white font-bold py-1.5 rounded text-[11px]">🗑 Verwijder</button>
                                <button onClick={clearSelection}
                                    className="bg-dark-900 hover:bg-dark-800 text-gray-300 font-bold py-1.5 rounded text-[11px]">Deselect</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ============== MOVE COLLECTION MODAL (v3.1.2) ==============
        // Verplaats geselecteerde mockups naar nieuwe of bestaande collectie.
        function MoveCollectionModal({ ids, designs, onClose, onMove }) {
            const [mode, setMode] = useState('new'); // 'new' | 'existing'
            const [newLabel, setNewLabel] = useState('');
            const [existingRunId, setExistingRunId] = useState('');
            const [busy, setBusy] = useState(false);

            // Build list of existing collections
            const collections = useMemo(() => {
                const seen = new Map();
                for (const d of designs) {
                    if (d.bulkRunId && !seen.has(d.bulkRunId)) {
                        seen.set(d.bulkRunId, d.bulkRunLabel || d.bulkRunId);
                    }
                }
                return Array.from(seen.entries()).map(([id, label]) => ({ id, label }));
            }, [designs]);

            const submit = async () => {
                setBusy(true);
                if (mode === 'new') {
                    if (!newLabel.trim()) { alert('Vul een naam in.'); setBusy(false); return; }
                    await onMove(ids, { type: 'new', label: newLabel.trim() });
                } else {
                    if (!existingRunId) { alert('Kies een collectie.'); setBusy(false); return; }
                    await onMove(ids, { type: 'existing', runId: existingRunId });
                }
                setBusy(false);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-dark-800 border border-white/10 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                        <div>
                            <h3 className="text-lg font-bold">Verplaats {ids.length} mockup{ids.length === 1 ? '' : 's'}</h3>
                            <p className="text-xs text-gray-400 mt-1">
                                Naar een nieuwe of bestaande collectie. Run-share-tokens worden gereset bij verplaatsen.
                            </p>
                        </div>

                        <div className="grid grid-cols-2 gap-1 bg-dark-900 p-1 rounded-lg border border-white/5">
                            <button onClick={() => setMode('new')}
                                className={`py-1.5 text-xs font-medium rounded-md ${mode === 'new' ? 'bg-dark-700 text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}>
                                Nieuwe collectie
                            </button>
                            <button onClick={() => setMode('existing')}
                                disabled={collections.length === 0}
                                className={`py-1.5 text-xs font-medium rounded-md disabled:opacity-30 ${mode === 'existing' ? 'bg-dark-700 text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}>
                                Bestaande collectie
                            </button>
                        </div>

                        {mode === 'new' && (
                            <div>
                                <label className="block text-[11px] text-gray-400 mb-1">Naam nieuwe collectie</label>
                                <input type="text" value={newLabel} autoFocus
                                    onChange={(e) => setNewLabel(e.target.value)}
                                    placeholder="Bv. Cosis februari 2026"
                                    className="w-full bg-dark-900 border border-gray-700 rounded px-2 py-2 text-sm" />
                            </div>
                        )}

                        {mode === 'existing' && (
                            <div>
                                <label className="block text-[11px] text-gray-400 mb-1">Bestaande collectie</label>
                                <select value={existingRunId} onChange={(e) => setExistingRunId(e.target.value)}
                                    className="w-full bg-dark-900 border border-gray-700 rounded px-2 py-2 text-sm">
                                    <option value="">— kies collectie —</option>
                                    {collections.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                </select>
                            </div>
                        )}

                        <div className="flex gap-2 pt-2 border-t border-white/5">
                            <button onClick={onClose} className="text-[11px] text-gray-400 hover:text-gray-200">Annuleer</button>
                            <button onClick={submit} disabled={busy}
                                className="ml-auto bg-white text-black text-sm font-bold py-1.5 px-4 rounded hover:bg-gray-200 disabled:opacity-50">
                                {busy ? 'Bezig…' : 'Verplaats'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ============== SHARE MODAL (v3.1) ==============
        // Toont share-URL voor één mockup. Genereert token bij eerste open.
        function ShareModal({ design, onClose, onEnsureToken, onRevoke }) {
            const [resolved, setResolved] = useState(design);
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                let cancelled = false;
                (async () => {
                    if (!design.shareToken) {
                        const updated = await onEnsureToken(design);
                        if (!cancelled) setResolved(updated);
                    } else {
                        setResolved(design);
                    }
                })();
                return () => { cancelled = true; };
            }, [design.id]);

            const url = resolved.shareToken
                ? `${window.location.origin}${window.location.pathname}?share=${resolved.shareToken}`
                : '';

            const expiresStr = resolved.shareExpiresAt
                ? new Date(resolved.shareExpiresAt).toLocaleDateString('nl-NL')
                : '—';

            const copyUrl = async () => {
                if (!url) return;
                try {
                    await navigator.clipboard.writeText(url);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (e) { alert('Kopiëren faalde — selecteer handmatig.'); }
            };

            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-dark-800 border border-white/10 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                        <div>
                            <h3 className="text-lg font-bold">Deel deze mockup</h3>
                            <p className="text-xs text-gray-400 mt-1">
                                De ontvanger ziet alleen deze ene mockup en kan een foto uploaden — geen toegang tot de rest van de tool.
                            </p>
                        </div>

                        {!url ? (
                            <div className="text-center text-gray-500 py-4 text-sm">Token aanmaken…</div>
                        ) : (
                            <>
                                <div>
                                    <label className="block text-[11px] text-gray-400 mb-1">Share-URL</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={url} readOnly
                                            className="flex-1 bg-dark-900 border border-gray-700 rounded px-2 py-2 text-xs font-mono"
                                            onFocus={(e) => e.target.select()} />
                                        <button onClick={copyUrl}
                                            className="bg-blue-600 hover:bg-blue-500 text-white px-3 rounded text-xs font-bold whitespace-nowrap">
                                            {copied ? '✓ Gekopieerd' : 'Kopieer'}
                                        </button>
                                    </div>
                                </div>
                                <div className="text-[11px] text-gray-500">
                                    Verloopt op: <span className="text-gray-300">{expiresStr}</span>
                                </div>
                                <div className="flex gap-2 pt-2 border-t border-white/5">
                                    <button onClick={() => onRevoke(resolved)}
                                        className="text-[11px] text-red-400 hover:text-red-300">
                                        Token intrekken
                                    </button>
                                    <button onClick={onClose}
                                        className="ml-auto bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold py-1.5 px-4 rounded">
                                        Sluit
                                    </button>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

            return (

                    <div className="bg-dark-800 border border-white/10 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                        <div>
                            <h3 className="text-lg font-bold">Deel hele run</h3>
                            <p className="text-xs text-gray-400 mt-1">
                                "{runInfo.runLabel}" — collega ziet alle mockups in deze campagne en kan per stuk een foto uploaden. Geen toegang tot de rest van de tool.

                        </div>

                        {!url ? (

                </div>

        function BulkPanel({ brandKits, defaults, setDefaults, mode, setMode, onMockupsAdded }) {
            const [tsvText, setTsvText] = useState('');
            const [parsed, setParsed] = useState({ rows: [], headerError: null });
            const [bulkImages, setBulkImages] = useState({}); // {filename: imageData}
            const [sharedImage, setSharedImage] = useState(null);
            const [progress, setProgress] = useState(null);
            const [hint, setHint] = useState('');
            const [campaignLabel, setCampaignLabel] = useState('');

            // Re-parse when text/mode/defaults/brands change
            useEffect(() => {
                if (!tsvText.trim()) { setParsed({ rows: [], headerError: null }); return; }
                setParsed(parseTSV(tsvText, mode, defaults, brandKits));
            }, [tsvText, mode, defaults, brandKits]);

            const onDropImages = async (e) => {
                e.preventDefault();
                const files = Array.from(e.dataTransfer.files || []);
                if (!files.length) return;
                const updates = {};
                for (const f of files) {
                    if (!f.type.startsWith('image/')) continue;
                    try {
                        const data = await fileToImageData(f);
                        updates[f.name] = data;
                    } catch (err) { console.error('image load failed', f.name, err); }
                }
                setBulkImages(prev => ({ ...prev, ...updates }));
            };

            const onSharedImageUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const data = await fileToImageData(file);
                setSharedImage(data);
                e.target.value = '';
            };

            const toggleSkip = (rowNum) => {
                setParsed(prev => ({
                    ...prev,
                    rows: prev.rows.map(r => r.rowNum === rowNum ? { ...r, skip: !r.skip } : r),
                }));
            };

            const copyClaudePrompt = async () => {
                const prompt = buildClaudePrompt(mode, defaults, brandKits);
                try {
                    await navigator.clipboard.writeText(prompt);
                    setHint('Prompt gekopieerd. Plak in Claude.');
                    setTimeout(() => setHint(''), 3000);
                } catch (e) {
                    setHint('Kopiëren faalde — selecteer handmatig.');
                }
            };

            const generateBulk = async () => {
                const valid = parsed.rows.filter(r => !r.skip && r.errors.length === 0);
                if (!valid.length) {
                    alert('Geen geldige rijen om te genereren.');
                    return;
                }
                if (!campaignLabel.trim()) {
                    alert('Vul een campagne-naam in voor deze run.');
                    return;
                }

                setProgress({ done: 0, total: valid.length });
                const zip = new JSZip();
                const reportLines = [`SocialFrame v3 — bulk export`, `Campagne: ${campaignLabel}`, `Modus: ${mode}`, `Totaal verwerkt: ${valid.length}`, ''];

                // Eén bulk_run_id voor alle mockups in deze batch — gebruikt om
                // ze later in de Gallery te groeperen.
                const bulkRunId = (typeof crypto !== 'undefined' && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : `run-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
                const bulkRunLabel = campaignLabel.trim();

                let cloudSaved = 0;

                for (let i = 0; i < valid.length; i++) {
                    const row = valid[i];
                    try {
                        const { content, style } = buildContentForRow(row, bulkImages, sharedImage);
                        const canvas = await renderToCanvas({
                            platformId: row.platformId,
                            formatId: row.formatId,
                            content, style,
                        });
                        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));

                        const variantLabel = (row.fields.naam || content.name || `row-${row.rowNum}`).replace(/[^a-z0-9_-]/gi, '_');
                        const filename = `${String(i + 1).padStart(3, '0')}_${variantLabel}_${row.platformId}_${row.formatId}.png`;
                        zip.file(filename, blob);

                        // Auto-save naar cloud-gallery (v3.1)
                        // awaiting_photo = true wanneer er nog geen foto staat én er
                        // wel een briefing-tekst is ingevuld (concept-fase voor de vormgever).
                        const hasBriefing = (content.imageDescription && content.imageDescription.trim()) || (content.imageText && content.imageText.trim());
                        const awaitingPhoto = !content.mainImage && !!hasBriefing;
                        const designId = `${bulkRunId}-${String(i + 1).padStart(3, '0')}`;
                        try {
                            await apiCall('designs_v3', 'save', toDbDesign({
                                id: designId,
                                platformId: row.platformId,
                                formatId: row.formatId,
                                content,
                                style,
                                date: new Date().toLocaleDateString('nl-NL') + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                awaitingPhoto,
                                bulkRunId,
                                bulkRunLabel,
                            }));
                            cloudSaved++;
                        } catch (cloudErr) {
                            console.error('cloud save failed', cloudErr);
                            reportLines.push(`     ⚠ cloud-save mislukt: ${cloudErr.message || cloudErr}`);
                        }

                        reportLines.push(`OK   row ${row.rowNum} → ${filename}`);
                        if (row.warnings.length) reportLines.push(`     warnings: ${row.warnings.join('; ')}`);
                    } catch (err) {
                        console.error('bulk render failed', row, err);
                        reportLines.push(`FAIL row ${row.rowNum}: ${err.message || err}`);
                    }
                    setProgress({ done: i + 1, total: valid.length });
                }

                // Skipped rows
                const skipped = parsed.rows.filter(r => r.skip || r.errors.length);
                if (skipped.length) {
                    reportLines.push('', '── overgeslagen ──');
                    for (const r of skipped) {
                        reportLines.push(`SKIP row ${r.rowNum}: ${r.skip ? '(handmatig)' : r.errors.join('; ')}`);
                    }
                }

                reportLines.push('', `Cloud-gallery: ${cloudSaved}/${valid.length} mockups opgeslagen onder "${bulkRunLabel}".`);

                zip.file('_report.txt', reportLines.join('\n'));
                const safeLabel = bulkRunLabel.replace(/[^a-z0-9_-]/gi, '_');
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, `${safeLabel}_${Date.now()}.zip`);
                setProgress(null);
                if (onMockupsAdded) onMockupsAdded(bulkRunId, bulkRunLabel);
            };

            const validCount = parsed.rows.filter(r => !r.skip && r.errors.length === 0).length;
            const skipCount = parsed.rows.filter(r => r.skip || r.errors.length).length;

            return (
                <div className="p-4 space-y-4 animate-fade-in flex-grow overflow-y-auto">
                    {/* Mode toggle */}
                    <div>
                        <label className="block text-[11px] text-gray-400 mb-1">Modus</label>

                        <p className="text-[10px] text-gray-500 mt-1">
                            {mode === 'simple' ? 'Brand/platform/format hieronder · TSV bevat alleen tekstvariaties.' : 'Alle kolommen per rij in de TSV.'}
